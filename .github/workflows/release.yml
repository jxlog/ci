name: Build, test and publish image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          python3 scripts/registry_target.py
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Test publication protocol
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ci-local:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Test before publication
        run: bash tests/smoke.sh ci-local:test
      - name: Log in to configured registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Publish tested build from local BuildKit cache
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Pull and test published digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          timeout 180 docker pull "$IMAGE@$DIGEST"
          bash tests/smoke.sh "$IMAGE@$DIGEST"
          actual=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$DIGEST")
          [[ "$actual" == "$GITHUB_SHA" ]]
          {
            echo '### Verified release'
            echo "- Source commit: $GITHUB_SHA"
            echo "- Version: $VERSION"
            echo "- Image: $IMAGE@$DIGEST"
            echo '- Platform: linux/amd64'
            echo '- Tests: pre-push and published-digest container tests passed'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify registry metadata and write publication receipt
        id: receipt
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          RUNTIME_TEST: passed_before_and_after_push
        run: python3 scripts/registry_receipt.py
      - name: Publish durable completion receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ steps.receipt.outputs.receipt }}
        run: python3 scripts/publish_receipt.py "$RECEIPT"
